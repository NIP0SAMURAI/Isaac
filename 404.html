<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found (404) — isaacløge.dk</title>
    <!-- Don’t index the 404 page -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#386939" />
    <link rel="icon" type="image/png" href="assets/images/icon-192.png" />
    <style>
      :root {
        --brand: #386939;
        --text: #0a0a0a;
        --muted: #6b7280;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--text);
        background: #fff;
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100vh;
      }
      main {
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      .card {
        width: 100%;
        max-width: 720px;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.15);
        text-align: left;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.75rem, 3.5vw, 2.25rem);
        line-height: 1.15;
      }
      .code {
        display: inline-block;
        color: var(--brand);
        font-weight: 800;
        letter-spacing: 1px;
      }
      p {
        margin: 0.5rem 0;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 1.25rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1rem;
        border-radius: 9999px;
        border: 1px solid rgba(56, 105, 57, 0.3);
        color: var(--brand);
        background: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .btn.primary {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }
      .btn:hover {
        background: rgba(56, 105, 57, 0.05);
      }
      .btn.primary:hover {
        filter: brightness(0.95);
      }
      footer {
        padding: 0.75rem 1rem 1.25rem;
        background: #f5faf7;
        text-align: center;
        color: var(--brand);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <a
      href="#main"
      style="
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      "
      >Skip to content</a
    >
    <main id="main">
      <div class="card" role="region" aria-labelledby="title">
        <div class="code" aria-hidden="true">404</div>
        <h1 id="title">Page not found</h1>
        <p>The page you’re looking for doesn’t exist here.</p>
        <p>Try one of the links below or go back to the homepage.</p>
        <div class="actions">
          <a class="btn primary" href="index.html">Home</a>
          <a class="btn" href="index.html#publications">Publications</a>
          <a class="btn" href="index.html#projects">Projects</a>
          <a class="btn" href="index.html#about">About Me</a>
          <a class="btn" href="index.html#contact">Contact</a>
        </div>
      </div>
    </main>
    <footer>
      © <span id="year"></span> Isaac Applequist Løge — Chemical Engineer
    </footer>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
